<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Blog - Sign In</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 2rem; border-radius: 12px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3b82f6; border: none; border-radius: 5px; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">Sign Up</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="authBtn">Sign Up</button>
    <p id="toggle" style="cursor:pointer; color:#3b82f6; font-size:12px;">Already have account? Log In</p>
    <p id="msg"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFqCteYqzT4QjTCamMXwMuHlmv4Q7NijA",
        authDomain: "news-blog-5ec5b.firebaseapp.com",
        projectId: "news-blog-5ec5b",
        storageBucket: "news-blog-5ec5b.firebasestorage.app",
        messagingSenderId: "376811288446",
        appId: "1:376811288446:web:237b8468af6fe2a2d9a52f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let isSignup = true;

    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const authBtn = document.getElementById('authBtn');
    const toggle = document.getElementById('toggle');
    const title = document.getElementById('title');
    const msg = document.getElementById('msg');

    toggle.onclick = () => {
        isSignup = !isSignup;
        title.innerText = isSignup ? "Sign Up" : "Log In";
        authBtn.innerText = isSignup ? "Sign Up" : "Log In";
        toggle.innerText = isSignup ? "Already have account? Log In" : "Need an account? Sign Up";
    };

    authBtn.onclick = () => {
        if (!email.value || !password.value) {
            msg.innerText = "Please fill in all fields!";
            return;
        }
        authBtn.innerText = "Processing...";
        
        if(isSignup) {
            createUserWithEmailAndPassword(auth, email.value, password.value)
            .then(() => {
                msg.innerText = "Success! Redirecting...";
                setTimeout(() => window.location.href = "index.html", 1500);
            })
            .catch(e => {
                msg.innerText = e.message;
                authBtn.innerText = "Sign Up";
            });
        } else {
            signInWithEmailAndPassword(auth, email.value, password.value)
            .then(() => {
                msg.innerText = "Logged In! Redirecting...";
                setTimeout(() => window.location.href = "index.html", 1500);
            })
            .catch(e => {
                msg.innerText = e.message;
                authBtn.innerText = "Log In";
            });
        }
    };
</script>
</body>
</html>
